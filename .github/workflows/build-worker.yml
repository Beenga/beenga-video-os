# Build the RunPod serverless worker and publish it to GHCR.
#
# ⚠ WHY THIS EXISTS INSTEAD OF RUNPOD'S GITHUB INTEGRATION.
#
# That integration refused to deploy, reporting "a handler function is required
# for queue-based endpoints" against a repo whose root contains `import runpod`,
# `def handler(job)` and `runpod.serverless.start(...)` — verified present on
# main. Matching runpod-workers/worker-basic exactly (rp_handler.py at root,
# requirements.txt, the start call inside `if __name__ == '__main__':`) did not
# clear it either. The check is opaque and its message does not describe what it
# actually wants.
#
# So the image is built here and deployed to RunPod as a plain Docker image,
# which is a supported path and one we can debug: the build log is right here.
name: build-worker

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "rp_handler.py", "requirements.txt", ".github/workflows/build-worker.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ⚠ A CUDA base plus torch does not fit in the ~14 GB a hosted runner
      # leaves free. This reclaims ~20 GB of preinstalled toolchains we do not
      # use. Without it the build dies partway with a disk-space error that
      # reads like a network failure.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # RunPod runs amd64; a native arm64 build would not boot
          push: true
          # Never :latest — it is mutable and makes cache behaviour impossible to
          # reason about when a deploy misbehaves.
          # ⚠ Lowercase, hardcoded. Docker repository names must be lowercase and
          # the org is "Beenga" -- ${{ github.repository_owner }} interpolates the
          # capital B and buildx rejects the tag outright.
          tags: |
            ghcr.io/beenga/beenga-worker:${{ github.sha }}
            ghcr.io/beenga/beenga-worker:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
